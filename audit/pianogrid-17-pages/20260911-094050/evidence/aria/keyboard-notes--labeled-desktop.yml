  - list:
    - listitem: Confirm the instrument’s lowest/highest notes and choose the matching supplied reference.
    - listitem: Locate C before a pair of black keys; choose the correct C octave.
    - listitem: Match and label one C–D–E–F–G–A–B white-key group.
    - listitem: Check the F/G/A/B region against the group of three black keys.
    - listitem: Match the black-key pairs C#/Db, D#/Eb, F#/Gb, G#/Ab and A#/Bb.
    - listitem: Continue through the chosen range, keeping octave suffixes consistent; use the instrument/label instructions for any physical application.
  - heading "Choose the layout that matches your keyboard" [level=2]
  - paragraph: Start with the 88-key reference, A0–C8, or select the 61-key example, C2–C7. Both use letter names and an optional octave suffix, with middle C labeled C4. The 61-key chart describes this specific range; a key count alone does not establish the labels of every keyboard model. Compare the leftmost and rightmost notes with your instrument.
  - heading "Read letters and octave labels" [level=2]
  - paragraph: The white keys repeat C–D–E–F–G–A–B within each numbered octave. Turn octave labels on to distinguish C3 from C4, or A4 from A5. The black-key labels show familiar sharp/flat pairs, such as F♯/G♭. An octave number identifies the note’s register; it is not a finger number or a scale degree.
  - heading "Label a small section first" [level=2]
  - paragraph: First locate a group of two black keys and find the C immediately before it. Match that C to the correct octave in the reference. Next, label the following white keys D, E, F, G, A and B. Check the three-black-key group above F, G, A and B before continuing. Add the sharp/flat names only after the white-key labels match.
  - heading "Where to start on the 61-key example" [level=2]
  - paragraph: For the C2–C7 layout, label the leftmost white key C2. Continue through B2, then begin C3, and repeat until the final C7. This layout has six C keys but spans five C-to-C octaves. On the A0–C8 layout, the first three keys are A0, A♯0/B♭0 and B0 before C1. Do not begin that layout with C.
  - heading "Print a reference you can read" [level=2]
  - paragraph: Choose the same layout and octave-label setting for screen and print. Use the marked octave sections to read a long keyboard in smaller pieces. The printout is a reference diagram, not a full-size sticker template. If you use physical labels, match each one to the verified key before applying it and follow the label and instrument instructions for placement.
