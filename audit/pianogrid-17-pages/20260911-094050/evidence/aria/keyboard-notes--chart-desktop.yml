    - paragraph: 61-key staff mode is reserved for a later release. The labeled reference already supports the verified C2–C7 layout.
  - heading "Match the note to the key" [level=2]
  - paragraph: Start with middle C, labeled C4 here. It is one ledger line below the treble staff and one ledger line above the bass staff. Both spellings point to the same piano key. The clef changes where that pitch is written; it does not create a different middle C.
  - 'heading "Treble clef: read from the bottom" [level=2]'
  - paragraph: The five treble-staff lines are E4, G4, B4, D5, and F5, read upward. The four spaces are F4, A4, C5, and E5. The curl of the clef identifies the G4 line. Use that anchor and the repeating musical alphabet to find nearby notes.
  - 'heading "Bass clef: a different set of positions" [level=2]'
  - paragraph: The bass-staff lines are G2, B2, D3, F3, and A3. Its spaces are A2, C3, E3, and G3. The two dots surround the F3 line. A note in the bottom space is therefore A2 in bass clef, while the bottom treble space is F4.
  - heading "Follow the lines beyond the staff" [level=2]
  - paragraph: Ledger lines extend the same line-and-space sequence. D4 lies just below the treble staff without a ledger line; C4 uses the first ledger line below it. Above bass clef, B3 needs no ledger line, and C4 uses the first one. Keep octave numbers visible when comparing notes with the same letter.
  - heading "Choose the range shown on your keyboard" [level=2]
  - paragraph: The full-piano view uses the standard 88-key range A0-C8. The 61-key view here uses C2-C7, a layout documented by VOX and Roland. Check your instrument’s endpoints and transpose setting before using that view. A key-count setting changes the visible keyboard range; it does not rename the clefs.
  - heading "Try one note in both directions" [level=2]
  - paragraph: Select C4 on the staff, then locate its highlighted key. Next, select G4 on the keyboard and read its treble position. Compare C3 with C4 to check the octave. For black keys, compare a sharp and a flat spelling while keeping the same physical key selected. Use the selected range for a readable printout.
