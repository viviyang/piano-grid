            - cell "2 – 1 – 2 – 2 – 1 – 3 – 1"
          - row "melodic minor classical 2 – 1 – 2 – 2 – 2 – 2 – 1":
            - cell "melodic minor classical"
            - cell "2 – 1 – 2 – 2 – 2 – 2 – 1"
  - region "Choose the minor form":
    - heading "Choose the minor form" [level=2]
    - paragraph: A natural minor uses A–B–C–D–E–F–G. Harmonic minor raises G to G♯. Classical melodic minor raises F and G on the way up and returns to the natural-minor notes on the way down. Select the form before comparing, listening, or printing.
    - region "A minor form comparison":
      - table "A minor form comparison":
        - caption: A minor form comparison
        - rowgroup:
          - row "Form Ascending Descending":
            - columnheader "Form"
            - columnheader "Ascending"
            - columnheader "Descending"
        - rowgroup:
          - row "Natural minor A – B – C – D – E – F – G – A A – G – F – E – D – C – B – A":
            - cell "Natural minor"
            - cell "A – B – C – D – E – F – G – A"
            - cell "A – G – F – E – D – C – B – A"
          - row "Harmonic minor A – B – C – D – E – F – G# – A A – G# – F – E – D – C – B – A":
            - cell "Harmonic minor"
            - cell "A – B – C – D – E – F – G# – A"
            - cell "A – G# – F – E – D – C – B – A"
          - row "Melodic minor (classical exercise) A – B – C – D – E – F# – G# – A A – G – F – E – D – C – B – A":
            - cell "Melodic minor (classical exercise)"
            - cell "A – B – C – D – E – F# – G# – A"
            - cell "A – G – F – E – D – C – B – A"
  - region "Same notes or same tonic?":
    - heading "Same notes or same tonic?" [level=2]
    - paragraph: C major and A natural minor share a note collection but organize it around different tonics. C major and C minor start on the same tonic; C natural minor lowers E, A and B to E♭, A♭ and B♭.
  - region "Give each note a job":
    - heading "Give each note a job" [level=2]
    - paragraph: In C major the degrees are C tonic, D supertonic, E mediant, F subdominant, G dominant, A submediant and B leading tone. In natural minor, degree seven is a whole step below the tonic and is called the subtonic.
    - region "Scale degree names":
      - table "Scale degree names":
        - caption: Scale degree names
        - rowgroup:
          - row "Degree Name":
            - columnheader "Degree"
            - columnheader "Name"
        - rowgroup:
          - row "1 tonic":
            - cell "1"
            - cell "tonic"
          - row "2 supertonic":
            - cell "2"
            - cell "supertonic"
          - row "3 mediant":
            - cell "3"
            - cell "mediant"
          - row "4 subdominant":
            - cell "4"
            - cell "subdominant"
          - row "5 dominant":
            - cell "5"
            - cell "dominant"
          - row "6 submediant":
            - cell "6"
            - cell "submediant"
          - row "7 leading tone":
            - cell "7"
            - cell "leading tone"
  - region "A few jazz scale examples":
    - heading "A few jazz scale examples" [level=2]
    - paragraph: Compare C Dorian (C D E♭ F G A B♭), C Mixolydian (C D E F G A B♭), and C blues (C E♭ F G♭ G B♭). Bebop dominant adds a major seventh to Mixolydian; C B B♭ A G F E D C gives a descending example. The choice of notes still depends on the musical context.
    - region "Jazz scale examples":
      - table "Jazz scale examples":
        - caption: Jazz scale examples
        - rowgroup:
          - row "Example Notes":
            - columnheader "Example"
            - columnheader "Notes"
        - rowgroup:
          - row "C Dorian C – D – Eb – F – G – A – Bb":
            - cell "C Dorian"
            - cell "C – D – Eb – F – G – A – Bb"
          - row "C Mixolydian C – D – E – F – G – A – Bb":
            - cell "C Mixolydian"
            - cell "C – D – E – F – G – A – Bb"
          - row "C blues C – Eb – F – Gb – G – Bb":
            - cell "C blues"
            - cell "C – Eb – F – Gb – G – Bb"
          - row "C bebop dominant C5 – B4 – Bb4 – A4 – G4 – F4 – E4 – D4 – C4":
            - cell "C bebop dominant"
            - cell "C5 – B4 – Bb4 – A4 – G4 – F4 – E4 – D4 – C4"
  - region "Continue with a different type":
    - heading "Continue with a different type" [level=2]
    - paragraph: Use the modes page to compare seven diatonic modes. Pentatonic and blues pages show their own note collections. Chromatic practice moves through every neighboring key. Harmonic major has its own reference page; it is not another name for harmonic minor.
  - region "Try one comparison":
    - heading "Try one comparison" [level=2]
    - paragraph: Pick two examples and name the notes that change. Play one hand at a time at a pace you can follow. Keep the tonic visible in the result. When a fingering is available, use only its stated hand, direction and octave range; a blank field is not an invitation to reuse another scale’s fingering.
  - region "Print the selected reference":
    - heading "Print the selected reference" [level=2]
    - paragraph: The print view should name the tonic, scale form, direction and range, and show exactly the notes in the result. Finger numbers belong on the printout only when that combination has been checked. See the individual scale reference for its available fingering.
    - paragraph: The current one-octave selection can be printed from the explorer. An all-scales or two-hand beginner PDF is not included in this release.
