  - button "Open navigation"
- main:
  - navigation "breadcrumb":
    - list:
      - listitem:
        - link "Scales" [disabled]
  - 'heading "Piano Scales: Notes, Patterns and Practice References" [level=1]'
  - paragraph: Compare major and minor scale notes, explore other scale types, and check the exact form before practicing.
  - region "Piano scale explorer":
    - text: Scale type
    - combobox "Scale type":
      - option "Major" [selected]
      - option "Natural minor"
      - option "Harmonic minor"
      - option "Melodic minor (classical)"
    - text: Starting note
    - combobox "Starting note":
      - option "C" [selected]
      - option "Db"
      - option "D"
      - option "Eb"
      - option "E"
      - option "F"
      - option "F#"
      - option "G"
      - option "Ab"
      - option "A"
      - option "Bb"
      - option "B"
      - option "Cb"
      - option "Gb"
      - option "C#"
    - text: Hand
    - combobox "Hand":
      - option "Right hand" [selected]
      - option "Left hand"
    - text: Direction
    - combobox "Direction":
      - option "Ascending" [selected]
      - option "Descending"
      - option "Up and down"
    - text: Current scale
    - heading "C Major" [level=2]
    - term: Hand
    - definition: Right hand
    - term: Range
    - definition: 1 octave
    - term: Tempo
    - definition: 60 BPM
    - paragraph: C – D – E – F – G – A – B – C
    - paragraph: "Semitone steps: 2 – 2 – 1 – 2 – 2 – 2 – 1"
    - heading "Ascending" [level=3]
    - text: Fingering from the listed sources
    - region "Ascending notes and fingering":
      - table:
        - rowgroup:
          - row "Notes C4 D4 E4 F4 G4 A4 B4 C5":
            - rowheader "Notes"
            - cell "C4"
            - cell "D4"
            - cell "E4"
            - cell "F4"
            - cell "G4"
            - cell "A4"
            - cell "B4"
            - cell "C5"
          - row "Fingers 1 2 3 1 2 3 4 5":
            - rowheader "Fingers"
            - cell "1"
            - cell "2"
            - cell "3"
            - cell "1"
            - cell "2"
            - cell "3"
            - cell "4"
            - cell "5"
    - region "treble staff notes":
      - 'group "treble clef: C4 to C5"':
        - img "C4, treble clef": C4
        - img "D4, treble clef": D4
        - img "E4, treble clef": E4
        - img "F4, treble clef": F4
        - img "G4, treble clef": G4
        - img "A4, treble clef": A4
        - img "B4, treble clef": B4
        - img "C5, treble clef": C5
    - heading "Keyboard" [level=3]
    - text: C4 to C5
    - region "C Major, Right hand, Ascending": C4 C#4 Db4 D4 D#4 Eb4 E4 F4 F#4 Gb4 G4 G#4 Ab4 A4 A#4 Bb4 B4 C5
    - button "Play scale"
    - button "Stop" [disabled]
    - status
    - region "Sources and checking scope":
      - heading "Sources and checking scope" [level=3]
      - list:
        - listitem:
          - 'link "Berklee PULSE: C Major Scale – Piano Notes & Practice"':
            - /url: https://pulse.berklee.edu/scales/c-major-scale.html
          - strong: "Checked for:"
          - text: C major note spelling and its key signature.
        - listitem:
          - 'link "LearnMusicTheory.net / High-Yield Music Theory: Major and Natural Minor Scales for Piano with Fingerings"':
            - /url: https://learnmusictheory.net/PDFs/pdffiles/01-02-07-ScalesforPiano.pdf
          - strong: "Checked for:"
          - text: C major one-octave note spelling and fingering for both hands, ascending and descending.
        - listitem:
          - 'link "Music Fun / Beatrice Wilder: Major Scale Fingering Charts for Keyboards"':
            - /url: https://www.musicfun.net.au/pdf_files/scale_fingering_maj.pdf
          - strong: "Checked for:"
          - text: Independent comparison of that one-octave fingering for both hands and directions.
    - button "Print current scale"
    - link "Open C detail":
      - /url: /scales/c-major
    - link "Open A detail":
      - /url: /scales/a-minor
    - status
    - paragraph: This release prints the current one-octave reference. It does not claim an all-scales or two-hand beginner PDF collection.
  - 'region "Piano scales: choose a sound, then a starting note"':
    - 'heading "Piano scales: choose a sound, then a starting note" [level=2]'
    - paragraph: "Start with C major: C–D–E–F–G–A–B–C. Choose another tonic to compare its notes. The final C repeats the first note one octave higher; it is not an eighth distinct scale degree."
  - region "Read the pattern":
    - heading "Read the pattern" [level=2]
    - paragraph: For a major scale, move by whole, whole, half, whole, whole, whole, half steps. A whole step spans two adjacent-key steps; a half step spans one. Keep the note spelling shown for the chosen key. Fifteen conventional major-key spellings in this chart represent twelve tonic pitch classes on an equal-tempered keyboard.
    - region "Major scale note chart":
      - table "Major scale note chart":
        - caption: Major scale note chart
        - rowgroup:
          - row "Starting note Notes, tonic to tonic":
            - columnheader "Starting note"
            - columnheader "Notes, tonic to tonic"
        - rowgroup:
          - row "C C – D – E – F – G – A – B – C":
            - cell "C"
            - cell "C – D – E – F – G – A – B – C"
          - row "Db Db – Eb – F – Gb – Ab – Bb – C – Db":
            - cell "Db"
            - cell "Db – Eb – F – Gb – Ab – Bb – C – Db"
          - row "D D – E – F# – G – A – B – C# – D":
            - cell "D"
            - cell "D – E – F# – G – A – B – C# – D"
          - row "Eb Eb – F – G – Ab – Bb – C – D – Eb":
            - cell "Eb"
            - cell "Eb – F – G – Ab – Bb – C – D – Eb"
          - row "E E – F# – G# – A – B – C# – D# – E":
            - cell "E"
            - cell "E – F# – G# – A – B – C# – D# – E"
          - row "F F – G – A – Bb – C – D – E – F":
            - cell "F"
            - cell "F – G – A – Bb – C – D – E – F"
          - row "F# F# – G# – A# – B – C# – D# – E# – F#":
            - cell "F#"
            - cell "F# – G# – A# – B – C# – D# – E# – F#"
          - row "G G – A – B – C – D – E – F# – G":
            - cell "G"
            - cell "G – A – B – C – D – E – F# – G"
          - row "Ab Ab – Bb – C – Db – Eb – F – G – Ab":
            - cell "Ab"
            - cell "Ab – Bb – C – Db – Eb – F – G – Ab"
          - row "A A – B – C# – D – E – F# – G# – A":
            - cell "A"
            - cell "A – B – C# – D – E – F# – G# – A"
