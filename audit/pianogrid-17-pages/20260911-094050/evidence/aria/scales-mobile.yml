            - cell "C#"
            - cell "C# – D# – E# – F# – G# – A# – B# – C#"
    - region "Scale form interval comparison":
      - table "Scale form interval comparison":
        - caption: Scale form interval comparison
        - rowgroup:
          - row "Form Semitone steps":
            - columnheader "Form"
            - columnheader "Semitone steps"
        - rowgroup:
          - row "major 2 – 2 – 1 – 2 – 2 – 2 – 1":
            - cell "major"
            - cell "2 – 2 – 1 – 2 – 2 – 2 – 1"
          - row "natural minor 2 – 1 – 2 – 2 – 1 – 2 – 2":
