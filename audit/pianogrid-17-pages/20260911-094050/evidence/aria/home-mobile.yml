      - paragraph: A simple first action
      - heading "New to piano? Try three notes" [level=2]
      - paragraph: Find the white C key immediately left of a group of two black keys. Continue right to D and E. The beginner guide turns those three notes into a short reading and counting exercise.
      - strong: C
      - strong: D
      - strong: E
      - paragraph: Locate C to the left of two black keys, then the next two white keys.
