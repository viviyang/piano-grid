  - region "Change one note. Hear the difference.":
    - paragraph: A small discovery
    - heading "Change one note. Hear the difference." [level=2]:
      - text: Change one note.
      - emphasis: Hear the difference.
    - paragraph: A minor is A, C, and E. Raise C to C♯ and you have A major. Same root. A different third.
    - link "Explore the A minor reference":
      - /url: /chords/a-minor
    - group "Choose a chord":
      - button "A minor" [pressed]
      - button "A major"
    - strong: A
    - text: Root
    - strong: C
    - text: Minor third
    - strong: E
    - text: Fifth 3 semitones 4 semitones
    - button "Hear A minor"
    - status: Synthesized tone preview
