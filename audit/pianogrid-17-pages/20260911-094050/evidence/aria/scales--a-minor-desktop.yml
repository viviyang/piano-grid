          - 'link "Hello Music Theory / Dan Farrant: A Minor Scale: Natural, Harmonic and Melodic"':
            - /url: https://hellomusictheory.com/learn/a-minor-scale/
          - strong: "Checked for:"
          - text: A natural minor note spelling.
        - listitem:
          - 'link "Pianoscales.org: Piano Minor Scales"':
            - /url: https://www.pianoscales.org/minor.html
          - strong: "Checked for:"
          - text: A natural minor note spelling and one-octave ascending fingering for both hands.
    - button "Print current scale"
    - status
    - paragraph: Finger numbers identify fingers, not scale degrees. Only one-octave, separately checked rows are shown.
  - region "Start with A natural minor":
    - heading "Start with A natural minor" [level=2]
    - paragraph: A natural minor uses A, B, C, D, E, F, and G. Its key signature has no sharps or flats. C major shares that signature, but A is the starting note and tonal reference here. The all-white-key description applies to natural minor; it does not describe every form of A minor.
  - region "Listen for the changed ending":
    - heading "Listen for the changed ending" [level=2]
    - paragraph: "Harmonic minor replaces G with G#. Classical melodic minor uses F# and G# on the way up, then F and G on the way down. Keep the form label visible when comparing the examples: a descending melodic scale is not simply the ascending note list played backward."
  - region "Practice the last four notes":
    - heading "Practice the last four notes" [level=2]
    - paragraph: Try E-F-G-A first, then E-F-G#-A, then E-F#-G#-A. Say the changed note names before playing each group. Next, start at the upper A and return through G-F-E. Keep this a note-recognition exercise; choose your own slow pace and pause between forms. Finish by naming which version you just played.
  - region "Connect the scale to chords":
    - heading "Connect the scale to chords" [level=2]
    - paragraph: "The natural-minor triads are Am, Bdim, C, Dm, Em, F, and G. Compare Em with E major: E major contains G#, matching the raised seventh in A harmonic minor. Use the existing A minor chord reference for voicing and inversions; this scale page focuses on which notes the chords draw from."
    - region "A natural minor scale chords":
      - table "A natural minor scale chords":
        - caption: A natural minor scale chords
        - rowgroup:
          - row "Degree Chord Notes":
            - columnheader "Degree"
