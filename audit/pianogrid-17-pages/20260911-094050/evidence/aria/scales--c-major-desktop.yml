    - button "Stop" [disabled]
    - status
    - region "Sources and checking scope":
      - heading "Sources and checking scope" [level=3]
      - list:
        - listitem:
          - 'link "Berklee PULSE: C Major Scale – Piano Notes & Practice"':
            - /url: https://pulse.berklee.edu/scales/c-major-scale.html
          - strong: "Checked for:"
          - text: C major note spelling and its key signature.
        - listitem:
          - 'link "LearnMusicTheory.net / High-Yield Music Theory: Major and Natural Minor Scales for Piano with Fingerings"':
            - /url: https://learnmusictheory.net/PDFs/pdffiles/01-02-07-ScalesforPiano.pdf
          - strong: "Checked for:"
          - text: C major one-octave note spelling and fingering for both hands, ascending and descending.
        - listitem:
          - 'link "Music Fun / Beatrice Wilder: Major Scale Fingering Charts for Keyboards"':
            - /url: https://www.musicfun.net.au/pdf_files/scale_fingering_maj.pdf
          - strong: "Checked for:"
          - text: Independent comparison of that one-octave fingering for both hands and directions.
    - button "Print current scale"
    - status
    - paragraph: Finger numbers identify fingers, not scale degrees. Only one-octave, separately checked rows are shown.
  - region "C Major notes":
    - heading "C Major notes" [level=2]
    - paragraph: C Major contains C, D, E, F, G, A, B. Repeat C at the top to complete one octave. Its key signature has no sharps or flats.
  - region "White keys, unequal distances":
    - heading "White keys, unequal distances" [level=2]
    - paragraph: C major uses only white keys, but those keys are not equally spaced in pitch. E–F and B–C are half steps; the other adjacent pairs in the scale are whole steps. Keep that distinction when checking the keyboard against the staff. Beginning on another white key does not preserve the C-major tonic.
  - region "One-octave fingering":
    - heading "One-octave fingering" [level=2]
    - paragraph: In this one-octave version, the right hand crosses from E with finger 3 to F with the thumb. The left hand crosses from G with the thumb to A with finger 3. Read the separate descending row when coming back. Finger numbers identify the fingers, not the scale degrees.
  - region "A short practice check":
    - heading "A short practice check" [level=2]
    - paragraph: "Suggested drill: play C–D–E, pause, then continue F–G–A–B–C with the printed right-hand fingers. Next, connect E–F without the pause. With the left hand, isolate G–A instead. Finish with one unhurried ascent and descent, saying each note name."
