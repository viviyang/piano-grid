  - 'heading "C Major Piano Scale: Notes and Fingering" [level=1]'
  - paragraph: See C major notes, key signature, keyboard pitches and separately verified one-octave fingering for each hand and direction.
  - region "C scale reference":
    - text: Starting note
    - strong: C
    - text: Key signature
    - strong: No sharps or flats
    - text: Range
    - strong: 1 octave
    - text: Hand
