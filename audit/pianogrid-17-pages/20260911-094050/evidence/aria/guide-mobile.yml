  - region "Start with three keys":
    - heading "Start with three keys" [level=2]
    - paragraph: "Find a group of two black keys. The white key immediately to its left is C. On an 88-key piano, middle C is C4. Find C4, then the next two white keys to its right: D4 and E4. Use the keyboard chart if your instrument has a different range."
    - link "Open the keyboard note chart":
      - /url: /keyboard-notes/chart
  - region "Try a four-count pattern":
    - heading "Try a four-count pattern" [level=2]
    - paragraph: "Original first task: play C4 on count 1, D4 on count 2, then E4 for counts 3–4. Keep saying the counts while the last note lasts. This gives you one bar of our 4/4 example. Start with one hand and choose a comfortable pace."
    - img "C4 for 1 count, D4 for 1 count, E4 for 2 counts":
      - strong: C4
      - text: count 1
      - strong: D4
      - text: count 2
      - strong: E4
      - text: counts 3–4
  - region "Choose the next step":
    - heading "Choose the next step" [level=2]
    - paragraph: Read the same notes on the staff, then clap a rhythm before learning a short piece. The printable starter pack includes both-clef note examples, two sight-reading lines and two rhythm lines. For chord playing, begin with C–E–G and follow the chord guide.
    - link "Open the chord guide":
      - /url: /chords
  - complementary "Piano Starter and Reading Pack":
