    - paragraph: The chart includes the major and minor triads already prepared across six common major keys and D minor, plus selected parallel and enharmonic comparisons. It is a practical foundation, not a complete list of piano chords.
    - paragraph: Choose a root note and chord type to narrow the chart. Each result gives the chord symbol, its three notes, and one root-position example. The first note listed is the lowest note in that example.
    - paragraph: For a first comparison, use A major and A minor, or C major and C minor. Keep the root and top note the same and notice which middle note changes.
  - region "How to read this piano chord chart":
    - heading "How to read this piano chord chart" [level=2]
    - paragraph: A dot marks a key to play. The labels identify those pitches; a sharp (♯) raises a written note by one semitone, and a flat (♭) lowers it by one semitone.
    - paragraph: C4 means middle C. The number after a note is its octave, not a finger number. The diagrams use the same C3–C5 window so you can compare positions. A note such as C♭4 keeps the octave of its written C even though it uses the B3 key.
    - list:
      - listitem: Read the chord name and its note list. A symbol such as Am names the root A and the minor chord type.
      - listitem: Match the marked keys to the labels. Notes are listed from lowest to highest.
      - listitem: Use Play chord to hear the notes together, or Play notes one at a time to hear the same notes in ascending order.
      - listitem: Compare the keyboard image with the printed note list before playing it on your instrument.
  - 'region "Major and minor: change the third"':
    - 'heading "Major and minor: change the third" [level=2]'
    - paragraph: A major triad places its third four semitones above the root. A minor triad places its third three semitones above the root. Both use a perfect fifth, seven semitones above the root.
    - paragraph: In the A examples, C♯ becomes C while A and E stay in place. In the C examples, E becomes E♭ while C and G stay in place. The note names in the tables are chord members, not finger numbers.
    - region "Major and minor comparison":
      - table:
        - rowgroup:
          - row "Root Major triad Minor triad What changes":
            - columnheader "Root"
            - columnheader "Major triad"
            - columnheader "Minor triad"
            - columnheader "What changes"
        - rowgroup:
          - row "A A–C♯–E A–C–E C♯ lowers to C":
            - cell "A"
            - cell "A–C♯–E"
            - cell "A–C–E"
            - cell "C♯ lowers to C"
          - row "C C–E–G C–E♭–G E lowers to E♭":
            - cell "C"
            - cell "C–E–G"
            - cell "C–E♭–G"
            - cell "E lowers to E♭"
