  - status
  - region "What to notice":
    - heading "What to notice" [level=2]
    - paragraph: All three chord tones are white keys. Moving C above E and G gives E–G–C; E in the bass makes that first inversion, while C remains the root.
  - region "Compare three positions":
    - heading "Compare three positions" [level=2]
    - paragraph: The diagrams keep the chord’s spelling while changing which chord tone is lowest. Read the bass note under each position, then compare the note order. Finger numbers are shown only where the exact example has a source; no hand shape is prescribed for the remaining voicings.
    - region "C major inversion comparison table":
      - 'table "C major: root position, first inversion, and second inversion"':
        - caption: "C major: root position, first inversion, and second inversion"
        - rowgroup:
          - row "Position Symbol Notes, low to high Bass":
