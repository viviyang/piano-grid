  - region "Choose your next version":
    - heading "Choose your next version" [level=2]
    - paragraph: Choose a specific arrangement before starting. The cards below offer a reflective piece, a cheerful programme option, a familiar theme, an intermediate solo and an accompaniment resource.
    - link "Browse easy piano versions":
      - /url: /songs/easy
  - region "Sad or reflective":
    - heading "Sad or reflective" [level=2]
    - paragraph: Gymnopédie No. 1 is our reflective selection because the publisher describes long phrases and wide bass-to-chord spacing. “Sad” is an editorial listening lens; it is not an objective property of every performance.
  - region "Happy, cool or fun":
    - heading "Happy, cool or fun" [level=2]
    - paragraph: The Happy Farmer is a cheerful-title selection. Addams Family Theme is a theme-song choice for a playful programme. Their appeal depends on your audience and preferences.
  - region "Beautiful":
    - heading "Beautiful" [level=2]
    - paragraph: For a spacious, reflective goal, audition the selected Gymnopédie. Choose the sound you want to work on; this is not a beauty ranking.
  - region "Intermediate":
    - heading "Intermediate" [level=2]
    - paragraph: The Gymnopédie edition is late intermediate and calls attention to long phrases and bass-to-chord spacing. Empire State of Mind is in an explicitly intermediate piano-solo collection; inspect its own sample before comparing the two.
  - region "Types of piece":
    - heading "Types of piece" [level=2]
    - paragraph: The catalogue includes an étude route on the challenging page, a fantasy there, soundtrack tracks such as Sweden, simplified classical excerpts and songs arranged for singing. These labels help you choose a playing task.
  - region "Sing and play":
    - heading "Sing and play" [level=2]
    - paragraph: All of Me has a vocal line and piano part with guitar chord frames. Start there when you need singing support; choose the Easy Songs page for a melody-first solo task.
  - region "Open the exact edition":
    - heading "Open the exact edition" [level=2]
    - paragraph: Each resource names its edition and access route. Publisher difficulty labels describe that arrangement. Use the provider’s preview before purchasing; check the chosen digital format before expecting a printable PDF.
