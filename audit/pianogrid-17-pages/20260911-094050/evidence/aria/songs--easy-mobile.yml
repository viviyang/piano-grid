  - paragraph: 50 exact edition-backed options are available; never describe them as a graded top50 ranking. A 10/30 subset must name its explicit selection criteria and preserve version metadata.
  - region "Choose an easy version you can actually use":
    - heading "Choose an easy version you can actually use" [level=2]
    - paragraph: Start with the arrangement, not just the song title. The featured choices below identify a specific score or lesson and explain the next thing to check. Publisher labels such as Early Elementary and Easy Piano come from different series; treat them as starting points for comparing the actual music.
  - region "For a child’s first few pieces":
    - heading "For a child’s first few pieces" [level=2]
    - paragraph: Hot Cross Buns comes with first-lesson materials and a parent guide. The early-elementary Twinkle version adds a hand-position graphic and a matching tutorial. For a birthday goal, the early-elementary Happy Birthday divides the melody between the hands. Choose the version and lesson together.
  - region "If you want a C-major version":
    - heading "If you want a C-major version" [level=2]
    - paragraph: The listed early-elementary Twinkle, Jingle Bells and Happy Birthday editions are in C major. The selected Ode to Joy arrangement is in D major, so it is outside this filter. A key name alone does not describe the rhythm, hand movement or reading work.
  - region "For adult beginners":
    - heading "For adult beginners" [level=2]
    - paragraph: If you follow Alfred’s adult course, compare The Rainbow Connection or Nadia’s Theme in its Greatest Hits Book 1 with your current lesson. If you want a broader menu, the edition-backed list offers fifty titles from one Easy Piano collection. Those are purchased arrangements, not fifty free downloads or fifty individually tested recommendations.
  - region "For a gentle piece or a small performance":
    - heading "For a gentle piece or a small performance" [level=2]
    - paragraph: "For a gentle option, compare the two Twinkle arrangements and listen to their separate samples. For a small performance, choose a meaningful occasion: Happy Birthday gives you a clear audience and purpose. “Beautiful” and “impressive” describe your goal here; neither is a guaranteed listener response."
  - region "Before you commit":
    - heading "Before you commit" [level=2]
    - paragraph: "Open the exact resource, check how to obtain it, and try a short section at a comfortable pace. Prefer a version whose instructions you understand. Several free provider downloads request your name and email. For a printed copy, check the chosen format: an online digital book and a downloadable PDF are different products."
